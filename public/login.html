<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Roumine Minifootball</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="auth-body">
    <div class="auth-container container">
        <div class="auth-header">
            <img src="/assets/roumine-logo.png" alt="Municipality Logo" class="auth-logo" onerror="this.style.display='none'">
            <h2>Welcome Back</h2>
            <p>Sign in to manage your bookings</p>
        </div>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <p id="errorMessage" class="error-text"></p>
            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="divider"><span>OR</span></div>

        <button id="googleLoginBtn" class="btn-secondary">Sign in with Google</button>
        
        <p class="auth-footer">Don't have an account? <a href="register.html">Sign up here</a></p>
    </div>

    <script type="module" src="./js/auth.js"></script>
</body>
</html>
