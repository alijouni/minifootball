<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Roumine Minifootball</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="auth-body">
    <div class="auth-container container">
        <div class="auth-header">
            <h2>Citizen Registration</h2>
            <p>Create an account to book the minifootball pitch</p>
        </div>

        <form id="registerForm" class="auth-form">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" required placeholder="Ahmad Hassan">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="03 123 456">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
            </div>
            <p id="errorMessage" class="error-text"></p>
            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="login.html">Sign in here</a></p>
    </div>

    <script type="module" src="./js/register.js"></script>
</body>
</html>
