<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard - Roumine Minifootball</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="muni-header">
        <div>
            <h1>Manager Dashboard</h1>
            <p>Municipality of Roumine</p>
        </div>
        <button id="logoutBtn" class="btn-secondary" style="width: auto; margin-top: 0;">Sign Out</button>
    </header>

    <main class="container" style="max-width: 1000px;">
        <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>Today's Bookings</h2>
            <span id="currentDate" style="font-weight: bold; color: var(--muni-green);"></span>
        </div>
        
        <div class="table-responsive">
            <table class="muni-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Citizen Name</th>
                        <th>Phone Number</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; padding: 2rem;">Loading bookings...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="./js/manager.js"></script>
</body>
</html>
