<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roumine Minifootball Booking</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="muni-header">
        <div>
            <h1>Municipality of Roumine</h1>
            <p>Official Minifootball Pitch</p>
        </div>
        <div id="auth-section">
            <button id="loginBtn" class="btn-primary" style="width: auto;" onclick="window.location.href='login.html'">Sign In</button>
        </div>
    </header>

    <main class="container">
        <h2>Book a Time Slot</h2>
        <div class="calendar-wrapper">
            <div class="calendar-header">
                <button id="prevMonthBtn">&lt;</button>
                <h3 id="monthYearDisplay">Month Year</h3>
                <button id="nextMonthBtn">&gt;</button>
            </div>
            <div class="calendar-days-header">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div id="calendarGrid" class="calendar-grid">
                <!-- JavaScript will inject days here -->
            </div>
        </div>

        <h3 id="selectedDateDisplay" style="margin-top: 1.5rem; margin-bottom: 1rem;">Available Slots</h3>
        
        <div class="time-slots" id="slots-container">
            <p>Please sign in to view availability.</p>
        </div>
    

        <button id="confirmBookingBtn" class="btn-primary" disabled>Confirm Booking</button>

    <div class="divider"><span>YOUR SCHEDULE</span></div>

    <h2>My Upcoming Bookings</h2>
    <div id="my-bookings-container" class="my-bookings-list">
        <p>Please sign in to view your bookings.</p>
    </div>
    </main>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
