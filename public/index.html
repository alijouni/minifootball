<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roumine Minifootball Booking</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="muni-header">
        <div>
            <h1>Municipality of Roumine</h1>
            <p>Official Minifootball Pitch</p>
        </div>
        <div id="auth-section">
            <button id="loginBtn" class="btn-primary" style="width: auto;" onclick="window.location.href='login.html'">Sign In</button>
        </div>
    </header>

    <main class="container">
        <h2>Book a Time Slot</h2>
        <p>Select an available time for today:</p>
        
        <div class="time-slots" id="slots-container">
            <p>Please sign in to view availability.</p>
        </div>

        <button id="confirmBookingBtn" class="btn-primary" disabled>Confirm Booking</button>
    </main>

    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
