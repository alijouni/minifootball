<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Roumine Minifootball</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header class="muni-header">
        <div>
            <h1>Admin Dashboard</h1>
            <p>Municipality of Roumine</p>
        </div>
        <div>
            <button id="managerPortalBtn" class="btn-secondary" style="width: auto; margin-top: 0; margin-right: 10px;" onclick="window.location.href='manager.html'">Manager Portal</button>
            <button id="logoutBtn" class="btn-secondary" style="width: auto; margin-top: 0;">Sign Out</button>
        </div>
    </header>

    <main class="container" style="max-width: 1000px;">
        <div style="margin-bottom: 3rem;">
            <h2>Pitch Configuration</h2>
            <p style="margin-bottom: 1rem; color: #6B7280;">Update pricing and operating hours for the main pitch.</p>
            
            <form id="pitchSettingsForm" class="auth-form" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label for="hourlyRate">Hourly Rate (LBP)</label>
                    <input type="number" id="hourlyRate" required>
                </div>
                <div class="form-group">
                    <label for="pitchStatus">Status</label>
                    <select id="pitchStatus" style="width: 100%; padding: 0.75rem; border: 1px solid #D1D5DB; border-radius: 8px;">
                        <option value="true">Open for Booking</option>
                        <option value="false">Closed for Maintenance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="openTime">Opening Time</label>
                    <input type="time" id="openTime" required>
                </div>
                <div class="form-group">
                    <label for="closeTime">Closing Time</label>
                    <input type="time" id="closeTime" required>
                </div>
                <button type="submit" class="btn-primary" style="grid-column: span 2;">Save Settings</button>
            </form>
        </div>

        <div class="divider"><span>USER MANAGEMENT</span></div>

        <div style="margin-top: 2rem;">
            <h2>System Users</h2>
            <p style="margin-bottom: 1rem; color: #6B7280;">Assign or revoke manager privileges.</p>
            
            <div class="table-responsive">
                <table class="muni-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 2rem;">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="./js/admin.js"></script>
</body>
</html>
